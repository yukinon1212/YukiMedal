<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="ローグライク × プッシャー式メダル落としゲーム" />
    <link rel="icon" type="image/png" href="/YukiMedal/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/YukiMedal/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <title>YukiMedal</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Orbitron', monospace;
        letter-spacing: 0.05em;
      }
      html {
        overflow: hidden;
      }
      body {
        background: #1a1a2e;
        overflow: hidden;
        width: 100vw;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      /* ── Portrait: rotate game to landscape fill ───────────────── */
      /* The medal pusher is a landscape game. On portrait mobile,    */
      /* we rotate #app 90° CW so the landscape content fills the    */
      /* portrait screen. Three.js renders at swapped dims (JS side). */
      @media (orientation: portrait) {
        #app {
          position: fixed !important;
          width: 100vh !important;   /* landscape width = portrait height */
          height: 100vw !important;  /* landscape height = portrait width */
          top: 0 !important;
          left: 0 !important;
          transform-origin: 0 0;
          transform: rotate(90deg) translate(0, -100%) !important;
        }
      }
      #ui-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        color: #e0e0e0;
      }
      #ui-root * {
        pointer-events: auto;
      }
      /* ── Portrait: rotate hint (fixed, so it stays upright outside the rotated #app) */
      @keyframes rotateHintFade {
        0%   { opacity: 0.9; }
        70%  { opacity: 0.9; }
        100% { opacity: 0; }
      }
      @keyframes rotateIcon {
        0%   { transform: rotate(0deg); }
        50%  { transform: rotate(90deg); }
        100% { transform: rotate(0deg); }
      }
      #rotate-hint {
        display: none;
      }
      @media (orientation: portrait) {
        #rotate-hint {
          display: flex;
          position: fixed;
          bottom: 16px;
          left: 50%;
          transform: translateX(-50%);
          align-items: center;
          gap: 8px;
          background: rgba(0, 0, 0, 0.65);
          backdrop-filter: blur(8px);
          border: 1px solid rgba(255, 255, 255, 0.15);
          border-radius: 20px;
          padding: 8px 16px;
          color: rgba(255, 255, 255, 0.85);
          font-family: 'Orbitron', monospace;
          font-size: 11px;
          letter-spacing: 0.1em;
          z-index: 9999;
          pointer-events: none;
          white-space: nowrap;
          animation: rotateHintFade 5s ease forwards;
        }
        #rotate-hint .icon {
          font-size: 20px;
          animation: rotateIcon 1.5s ease-in-out infinite;
          display: inline-block;
        }
      }
    </style>
    <script type="module" crossorigin src="/YukiMedal/assets/index-CBHXk8Id.js"></script>
    <link rel="modulepreload" crossorigin href="/YukiMedal/assets/three-CzJWjZO5.js">
    <link rel="modulepreload" crossorigin href="/YukiMedal/assets/rapier-DpxwuBBO.js">
  <link rel="manifest" href="/YukiMedal/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/YukiMedal/registerSW.js"></script></head>
  <body>
    <div id="app">
      <div id="ui-root"></div>
    </div>
    <!-- Appears only in portrait mode; auto-fades after 5s. Not inside #app so it stays upright. -->
    <div id="rotate-hint">
      <span class="icon">📱</span>
      <span>横向きで最適表示</span>
    </div>
  </body>
</html>
