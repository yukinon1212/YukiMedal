      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Orbitron', monospace;
        letter-spacing: 0.05em;
      }
      body {
        background: #1a1a2e;
        overflow: hidden;
        width: 100vw;
